kind = "mobile"
previewPath = "/mobile/"
title = "BusTrack Mobile"
version = "1.0.0"
id = "artifacts/bus-tracker-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 25464

[services.development]
run = "pnpm --filter @workspace/bus-tracker-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bus-tracker-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bus-tracker-mobile", "run", "serve" ]

[services.env]
PORT = "25464"
BASE_PATH = "/mobile/"
